name: Sync ranking data and rebuild HTML

on:
  schedule:
    - cron: "17 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync data and generate static HTML
        run: |
          for attempt in 1 2 3; do
            if npm run sync; then
              exit 0
            fi
            echo "Sync attempt $attempt failed"
            sleep $((attempt * 20))
          done
          echo "All sync attempts failed"
          exit 1

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data.json index.html sitemap.xml vendor
          if git diff --cached --quiet; then
            echo "No ranking changes"
            exit 0
          fi
          git commit -m "chore: update ranking snapshot"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed, rebasing"
            git pull --rebase
          done
          exit 1

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "榜单自动同步失败";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "sync-failure",
            });
            const body = `定时同步任务失败，页面数据可能已停留在旧快照。\n\n运行日志：${url}`;
            if (issues.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["sync-failure"],
              });
            }
