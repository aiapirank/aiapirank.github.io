name: Sync ranking data and rebuild HTML

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync data and generate static HTML
        run: npm run sync

      - name: Commit updated snapshot
        run: |
          if git diff --quiet; then
            echo "No ranking changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html sitemap.xml
          git commit -m "chore: update ranking snapshot"
          git push
